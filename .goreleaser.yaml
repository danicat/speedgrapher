version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    main: ./cmd/speedgrapher
    binary: bin/speedgrapher
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ if eq .Os "windows" }}win32{{ else }}{{ .Os }}{{ end }}.{{ if eq .Arch "amd64" }}x64{{ else if eq .Arch "386" }}ia32{{ else }}{{ .Arch }}{{ end }}.{{ .ProjectName }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - plugin.json
      - mcp_config.json
      - README.md
      - llms.txt
      - LICENSE
      - .vale.ini
      - assets/*
      - rules/*
      - sidecars/**/*
      - skills/**/*
      - styles/**/*

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
